<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daniel's 2nd Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1 style="color: green; text-decoration: underline;">Welcome to my first HTML portfolio website!</h1>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <main>

        <!-- Contact Section -->
        <section id="contact">
            <h2 class="m-10 p-10 playfair-display">Contact</h2>
            <p>Feel free to reach out to me:</p>

            <address>
                <p class="text-red-500">Email: <a href="mailto:daniel@example.com">daniel@example.com</a></p>
            </address>

            <form action="#" method="post">
                <fieldset>
                    <legend>Contact Form</legend>

                    <p>
                        <label for="name">Name:</label><br>
                        <input type="text" id="name" name="name" required>
                    </p>

                    <p>
                        <label for="email">Email:</label><br>
                        <input type="email" id="email" name="email" required>
                    </p>

                    <p>
                        <label for="message">Message:</label><br>
                        <textarea id="message" name="message" rows="4" cols="30" required></textarea>
                    </p>

                    <button type="submit">Send</button>
                </fieldset>
            </form>
        </section>

    </main>

    <hr>

    <footer>
        <p>The End of The Site!</p>
    </footer>

</body>

</html>
